<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank-you notes — husbindos.</title>
<meta name="theme-color" content="#4A1B36">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
</head>
<body data-page="notes">
<header id="site-header"></header>

<div class="band pagehead"><div class="inner">
  <div class="eyebrow">The guestbook</div>
  <h1>Leave us a <em>note.</em></h1>
  <span data-flourish></span>
  <p class="sub">Write us something to keep.</p>
</div></div>

<div class="band section"><div class="inner grid">
  <div class="side"><h2>Write</h2><p>Notes are public on this page. Keep it kind, or at least funny.</p></div>
  <div class="main">
    <form class="form" id="note-form" novalidate>
      <div class="field full"><label for="n-name">Your name</label><input id="n-name" name="name" type="text" required maxlength="80" autocomplete="name" placeholder="So we know who to hug"></div>
      <div class="field full"><label for="n-msg">Your note</label><textarea id="n-msg" name="message" required maxlength="1500" placeholder="Dear Jay &amp; Albert…"></textarea></div>
      <div class="field hp" aria-hidden="true"><label for="n-web">Website</label><input id="n-web" name="website" type="text" tabindex="-1" autocomplete="off"></div>
      <div class="foot"><span class="hint">Takes a minute to show up on the wall.</span><button class="btn" type="submit">Send the note</button></div>
      <p class="status" role="status" aria-live="polite"></p>
    </form>
  </div>
</div></div>

<div class="band section rule"><div class="inner grid">
  <div class="side"><div class="eyebrow">The wall</div><div class="counter"><b id="note-count">–</b><span class="caps" style="color:var(--ink-soft)">notes so far</span></div></div>
  <div class="main wall" id="wall"></div>
</div></div>

<footer id="site-footer"></footer>
<script src="site.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank-you notes — husbindos.</title>
<meta name="theme-color" content="#4A1B36">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
</head>
<body data-page="notes">
<header id="site-header"></header>

<section class="section">
  <div class="wrap narrow">
    <div class="section-head rv">
      <div class="eyebrow">The guestbook</div>
      <h1>Leave us a <em>note</em></h1>
      <span data-divider></span>
      <p>A memory from the day, a wish for the years ahead, or the thing you didn't get to say before the afterparty swallowed us. Notes appear on the wall below.</p>
    </div>

    <form class="form rv" id="note-form" novalidate>
      <div class="field"><label for="n-name">Your name</label><input id="n-name" name="name" type="text" required maxlength="80" autocomplete="name" placeholder="So we know who to hug"></div>
      <div class="field"><label for="n-msg">Your note</label><textarea id="n-msg" name="message" required maxlength="1500" placeholder="Dear Jay &amp; Albert…"></textarea></div>
      <div class="field hp" aria-hidden="true"><label for="n-web">Website</label><input id="n-web" name="website" type="text" tabindex="-1" autocomplete="off"></div>
      <div class="form-foot">
        <span class="hint">Notes are public on this page.</span>
        <button class="btn" type="submit">Send the note</button>
      </div>
      <div class="status" role="status" aria-live="polite"></div>
    </form>
  </div>
</section>

<section class="section alt">
  <div class="wrap">
    <div class="section-head">
      <div class="eyebrow">The wall</div>
      <h2>Words from <em>our people</em></h2>
    </div>
    <div class="wall" id="wall"></div>
  </div>
</section>

<footer id="site-footer"></footer>
<script src="site.js"></script>
</body>
</html>
